name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Test & Build Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-extensions
          path: dist
          if-no-files-found: error

  shared-ci-user-ext:
    name: Shared CI - User Extension
    needs: verify
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-ci.yml@v1
    with:
      extension-dir: 'apps/user-extension'
      run-lint: false
      run-unit-tests: false

  shared-ci-admin-ext:
    name: Shared CI - Admin Extension
    needs: verify
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-ci.yml@v1
    with:
      extension-dir: 'apps/admin-extension'
      run-lint: false
      run-unit-tests: false
