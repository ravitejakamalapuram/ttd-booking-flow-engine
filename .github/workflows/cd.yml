name: CD

# Store releases are on demand only (Actions -> CD -> Run workflow). Publishing on
# every push re-uploads while an item is in review and burns a version tag each time.
on:
  workflow_dispatch:

# Never cancel a release mid-flight: half-created tags/releases are bad state.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: built-extensions
          path: dist

  release-user-extension:
    name: Release User Extension to CWS
    needs: build
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-cd.yml@v1
    with:
      extension-dir: 'apps/user-extension'
    secrets:
      chrome-extension-id: ${{ secrets.CWS_USER_EXTENSION_ID }}
      chrome-client-id: ${{ secrets.CWS_CLIENT_ID }}
      chrome-client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
      chrome-refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}

  # Runs after the user-extension release, not in parallel: both jobs run the shared
  # version-bump and push a `v*` tag from the same commit, so in parallel they raced
  # on the same tag ("cannot lock ref 'refs/tags/v1.1.0'").
  release-admin-extension:
    name: Release Admin Extension to CWS
    needs: [build, release-user-extension]
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-cd.yml@v1
    with:
      extension-dir: 'apps/admin-extension'
    secrets:
      chrome-extension-id: ${{ secrets.CWS_ADMIN_EXTENSION_ID }}
      chrome-client-id: ${{ secrets.CWS_CLIENT_ID }}
      chrome-client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
      chrome-refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
